# Netlify deploy config. Cloudflare Pages uses public/_redirects (same rule).
[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/mockServiceWorker.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# SPA fallback — real files (assets, mockServiceWorker.js) are served first.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
